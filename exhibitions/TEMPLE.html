<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TEMPLE — SHIPTON</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="shortcut icon" href="/favicon.ico">
<meta name="theme-color" content="#ffffff">
<style>
:root{
--text:#1f120c;
--bg:#ffffff;
--sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
--header-h:120px;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
font-family:serif;
background:var(--bg);
color:var(--text);
overflow:hidden;
}

header{
position:fixed;
top:0;
width:100%;
padding:36px 48px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:9999;
}

.logo{
font-family:var(--sans);
font-size:18px;
font-weight:700;
text-decoration:none;
color:#fff;
}

.top-actions{
display:flex;
gap:28px;
color:#fff;
opacity:0.9;
}

.top-actions a:hover{opacity:1;}

main{
display:grid;
grid-template-columns:1fr 1fr;
height:100vh;
}

.image-column,
.text-column{
height:100vh;
overflow-y:auto;
overscroll-behavior:contain;
padding-top:var(--header-h);
}

.image-column{
padding-left:32px;
padding-right:32px;
padding-bottom:32px;
display:flex;
flex-direction:column;
gap:48px;
}

.image-column img{
width:100%;
display:block;
border-radius:6px;
}

figcaption{
font-size:12px;
line-height:1.4;
margin-top:8px;
}

.text-column{
padding-left:48px;
padding-right:48px;
padding-bottom:48px;
}

.title{
font-family:var(--sans);
font-size:clamp(4.5rem,10vw,8rem);
line-height:0.95;
letter-spacing:-0.04em;
margin-bottom:24px;
}

.subtitle{
font-size:14px;
margin-bottom:32px;
}

.section{
max-width:52ch;
font-size:14px;
line-height:1.6;
margin-bottom:40px;
}

@media(max-width:900px){
body{overflow:auto;}
header{position:sticky;background:transparent;}
main{grid-template-columns:1fr;height:auto;}
.text-column{order:1;height:auto;overflow:visible;padding:32px;}
.image-column{order:2;height:auto;overflow:visible;padding:32px;}
.title{font-size:3rem;}
}
</style>
</head>
<body>
<header>
<a href="../index.html" class="logo" aria-label="SHIPTON home"><img src="../Images/shipton-logo.png" alt="SHIPTON" loading="eager" decoding="async" style="display:block;height:90px;width:auto;object-fit:contain;"></a>
<nav class="top-actions">
<a href="../about.html">About</a>
<a href="../press.html">Press</a>
<a href="../friends.html">Friends</a>
</nav>
</header>
<main>
<section class="image-column">
<figure>
<img loading="eager" decoding="async" src="../Images/TEMPLE/Stan Buglass - Temple - image by Alexander Christie-7.jpg" alt="TEMPLE by Stan Buglass">
<figcaption>TEMPLE, Stan Buglass</figcaption>
</figure>
</section>
<section class="text-column">
<h1 class="title">TEMPLE</h1>
<p class="subtitle">Stan Buglass</p>
<div class="section">
<p>For all enquiries, please email info@shipton.gallery</p>
</div>
</section>
</main>
</body>
</html>
